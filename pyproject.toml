[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "widethink"
dynamic = ["version"]
description = "Brain-inspired wide thinking for LLMs: a harness that notices where the standard solution does not fit this particular user."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Egor" }]
keywords = [
  "llm",
  "reasoning",
  "test-time-compute",
  "tree-of-thoughts",
  "harness",
  "benchmark",
  "hidden-requirements",
  "cognitive-architecture",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.9"]
openai = ["openai>=1.40"]
local = ["sentence-transformers>=3.0"]
bench = ["pyyaml>=6.0"]
all = ["widethink[anthropic,openai,bench]"]
dev = [
  "widethink[all]",
  "build>=1.2",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.1",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/egor-gamedev/widethink"
Documentation = "https://github.com/egor-gamedev/widethink/tree/main/docs"
Issues = "https://github.com/egor-gamedev/widethink/issues"
Changelog = "https://github.com/egor-gamedev/widethink/blob/main/CHANGELOG.md"

[project.scripts]
widethink = "widethink.cli:main"

# --------------------------------------------------------------------------- build

[tool.hatch.version]
path = "src/widethink/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/widethink"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/benchmark",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/LICENSE",
]

# --------------------------------------------------------------------------- lint

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "C4",   # comprehensions
  "PIE",  # misc lints
  "RET",  # return statements
  "PT",   # pytest style
  "N",    # naming
  "RUF",  # ruff-specific
  "TID",  # tidy imports
  "PL",   # pylint subset
  "ERA",  # commented-out code
]
ignore = [
  "PLR0911",  # too many returns: decision functions read better flat
  "PLR0912",  # too many branches
  "PLR0913",  # too many arguments: keyword-only configuration is intentional
  "PLR0915",  # too many statements
  "PLR2004",  # magic values: thresholds are documented at the definition site
  "PLC0415",  # import inside function: optional SDKs are imported lazily on purpose
  "RUF001",   # ambiguous unicode in strings: prompts and renders use typographic characters
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "S101"]
"examples/**" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

# --------------------------------------------------------------------------- types

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["widethink"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- tests

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "live: calls a real LLM API; skipped unless WIDETHINK_LIVE_TESTS=1",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["widethink"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.",
]
