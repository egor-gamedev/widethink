name: Benchmark task idea
description: Propose a task for the Hidden Requirements benchmark.
labels: [benchmark]
body:
  - type: markdown
    attributes:
      value: |
        Please read the authoring checklist in docs/benchmark.md first. Do not paste
        private code; tasks are published under CC BY 4.0.
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: "e.g. data/privacy, backend/reliability, frontend/accessibility"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: The request and its standard solution
      description: What a user asks, and what a typical model answers.
    validations:
      required: true
  - type: textarea
    id: hidden
    attributes:
      label: Hidden requirement and its evidence
      description: What the standard solution misses, and where in the context a careful engineer would find it.
    validations:
      required: true
  - type: dropdown
    id: control
    attributes:
      label: Kind
      options: ["Task with hidden requirements", "Control task (the standard solution is right)"]
    validations:
      required: true
